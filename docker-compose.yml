services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      mediasoup:
        condition: service_healthy

  mediasoup:
    build:
      context: ./server
    ports:
      - "${SERVER_PORT:-3001}:3001"
      - "40000-40100:40000-40100/udp"
    environment:
      SERVER_PORT: "${SERVER_PORT:-3001}"
      MEDIASOUP_LISTEN_IP: "${MEDIASOUP_LISTEN_IP:-0.0.0.0}"
      MEDIASOUP_ANNOUNCED_IP: "${MEDIASOUP_ANNOUNCED_IP:-127.0.0.1}"
      MEDIASOUP_MIN_PORT: "${MEDIASOUP_MIN_PORT:-40000}"
      MEDIASOUP_MAX_PORT: "${MEDIASOUP_MAX_PORT:-40100}"
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
